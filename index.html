<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Study the six factors of natural selection with interactive flash cards."
    />
    <title>6 Factors of Natural Selection | Flash Cards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="study-shell">
      <div class="ambient ambient--one" aria-hidden="true"></div>
      <div class="ambient ambient--two" aria-hidden="true"></div>

      <header class="site-header">
        <a class="brand" href="#study-card" aria-label="Natural Selection home">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>Natural Selection</span>
        </a>
        <p class="course-label">Six-factor study deck</p>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">Biology • 7 cards</p>
          <h1 id="page-title">6 Factors of <em>Natural Selection</em></h1>
          <p class="intro">
            Start with all six factors, then flip through the short memory cues
            from your notes.
          </p>
        </div>

        <div class="study-area">
          <div class="card-status" aria-live="polite" aria-atomic="true">
            <span id="card-count">Card 01 / 07</span>
            <span class="side-label" id="side-label">Front</span>
          </div>

          <div class="card-stage">
            <button
              id="study-card"
              type="button"
              class="flashcard flashcard--lime"
              aria-pressed="false"
              aria-label="Show back of 6 factors of Natural Selection"
            >
              <span class="flashcard-inner">
                <span class="card-face card-front">
                  <span class="card-topline">
                    <span id="factor-number">Overview</span>
                    <span>Natural Selection</span>
                  </span>

                  <span class="selection-art selection-art--overview" aria-hidden="true">
                    <span class="environment"></span>
                    <span class="link link--one"></span>
                    <span class="link link--two"></span>
                    <span class="link link--three"></span>
                    <span class="specimen specimen--one"></span>
                    <span class="specimen specimen--two"></span>
                    <span class="specimen specimen--three"></span>
                    <span class="specimen specimen--four"></span>
                    <span class="specimen specimen--five"></span>
                    <span class="specimen specimen--six"></span>
                  </span>

                  <span class="name-wrap">
                    <span class="prompt" id="front-prompt">Start here</span>
                    <strong class="factor-name factor-name--overview" id="factor-name">6 factors of Natural Selection</strong>
                  </span>

                  <span class="flip-hint">
                    <span class="flip-symbol" aria-hidden="true">↻</span>
                    Tap to reveal
                  </span>
                </span>

                <span class="card-face card-back">
                  <span class="answer-kicker" id="answer-number">Overview</span>
                  <span class="back-factor" id="back-factor">The six factors</span>
                  <span class="rule" aria-hidden="true"></span>
                  <span class="overview-list" id="overview-list">
                    <span class="overview-item"><span>1</span><strong>Overproduction</strong></span>
                    <span class="overview-item"><span>2</span><strong>Variation</strong></span>
                    <span class="overview-item"><span>3</span><strong>Competition</strong></span>
                    <span class="overview-item"><span>4</span><strong>Heredity</strong></span>
                    <span class="overview-item"><span>5</span><strong>Differential Reproduction</strong></span>
                    <span class="overview-item"><span>6</span><strong>Environmental Pressure</strong></span>
                  </span>
                  <span class="description-label" id="description-label" hidden></span>
                  <strong class="definition" id="definition" hidden></strong>

                  <span class="flip-hint flip-hint--back">
                    <span class="flip-symbol" aria-hidden="true">↻</span>
                    Tap to see factor
                  </span>
                </span>
              </span>
            </button>
          </div>

          <nav class="card-controls" aria-label="Flash card controls">
            <button class="nav-button" id="previous-card" type="button">
              <span aria-hidden="true" class="arrow arrow--left">→</span>
              <span>Previous</span>
            </button>

            <div class="progress-dots" id="progress-dots" aria-label="Choose a card"></div>

            <button class="nav-button nav-button--next" id="next-card" type="button">
              <span>Next</span>
              <span aria-hidden="true" class="arrow arrow--right">→</span>
            </button>
          </nav>

          <p class="keyboard-tip" id="keyboard-tip">
            <span aria-hidden="true">Space</span> to flip •
            <span aria-hidden="true">← →</span> to move
          </p>
        </div>
      </section>

      <footer>
        <p>1 overview • 6 factors</p>
        <p>Study. Flip. Repeat.</p>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
