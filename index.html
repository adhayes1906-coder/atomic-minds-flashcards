<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Study the six factors of natural selection with interactive flash cards."
    />
    <title>6 Factors of Natural Selection | Flash Cards</title>
    <style>
:root {
  --forest: #10251e;
  --forest-soft: #1c3a2e;
  --paper: #f5f1e3;
  --paper-bright: #fffdf5;
  --muted: #a9b9ac;
  --lime: #b9d963;
  --gold: #efbc52;
  --coral: #ed7258;
  --sky: #72b7bd;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--forest);
  scroll-behavior: smooth;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  background:
    radial-gradient(circle at 15% 20%, rgba(185, 217, 99, 0.09), transparent 25rem),
    radial-gradient(circle at 86% 68%, rgba(114, 183, 189, 0.09), transparent 27rem),
    var(--forest);
  color: var(--paper);
  font-family: Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  font: inherit;
}

.study-shell {
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  overflow: hidden;
}

.study-shell::before {
  position: absolute;
  z-index: -1;
  top: 11rem;
  left: -9rem;
  width: 18rem;
  height: 18rem;
  border: 1px solid rgba(245, 241, 227, 0.07);
  border-radius: 50%;
  box-shadow:
    0 0 0 3.8rem rgba(245, 241, 227, 0.016),
    0 0 0 7.5rem rgba(245, 241, 227, 0.012);
  content: '';
}

.ambient {
  position: absolute;
  z-index: -1;
  width: 0.48rem;
  height: 0.48rem;
  border-radius: 50%;
  background: var(--lime);
  opacity: 0.7;
}

.ambient::before,
.ambient::after {
  position: absolute;
  width: 0.25rem;
  height: 0.25rem;
  border-radius: 50%;
  background: currentColor;
  content: '';
}

.ambient--one {
  top: 18%;
  right: 13%;
  color: var(--gold);
  box-shadow: -8rem 4rem 0 -0.08rem var(--coral), 7rem 10rem 0 -0.05rem var(--sky);
}

.ambient--one::before {
  top: -2.5rem;
  left: 2.4rem;
}

.ambient--one::after {
  top: 7rem;
  left: -2rem;
}

.ambient--two {
  right: 23%;
  bottom: 8%;
  color: var(--coral);
  box-shadow: 9rem -3rem 0 -0.07rem var(--gold), -15rem 1rem 0 -0.06rem var(--lime);
}

.site-header,
.hero,
footer {
  width: min(1180px, calc(100% - 3rem));
  margin-inline: auto;
}

.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-block: 1.8rem;
  border-bottom: 1px solid rgba(245, 241, 227, 0.12);
}

.brand {
  display: inline-flex;
  gap: 0.75rem;
  align-items: center;
  color: var(--paper);
  font-size: 0.85rem;
  font-weight: 750;
  letter-spacing: 0.09em;
  text-decoration: none;
  text-transform: uppercase;
}

.brand-mark {
  position: relative;
  display: grid;
  width: 2rem;
  height: 2rem;
  place-items: center;
  border: 1px solid rgba(245, 241, 227, 0.45);
  border-radius: 50% 8% 50% 8%;
  transform: rotate(-22deg);
}

.brand-mark::before {
  position: absolute;
  width: 0.75rem;
  height: 1.45rem;
  border: 1px solid var(--lime);
  border-radius: 100% 0 100% 0;
  content: '';
}

.brand-mark span {
  width: 0.3rem;
  height: 0.3rem;
  border-radius: 50%;
  background: var(--gold);
}

.course-label {
  margin: 0;
  color: var(--muted);
  font-family: "Courier New", Courier, monospace;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.hero {
  display: grid;
  grid-template-columns: minmax(250px, 0.72fr) minmax(420px, 1fr);
  gap: clamp(2.5rem, 7vw, 7rem);
  align-items: center;
  min-height: calc(100vh - 91px - 90px);
  padding-block: clamp(3rem, 6vw, 5.5rem);
}

.hero-copy {
  align-self: center;
  padding-bottom: 3rem;
}

.eyebrow,
.answer-kicker,
.prompt {
  margin: 0;
  color: var(--lime);
  font-family: "Courier New", Courier, monospace;
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

h1 {
  max-width: 11ch;
  margin: 1.15rem 0 1.4rem;
  color: var(--paper-bright);
  font-size: clamp(2.7rem, 5vw, 5rem);
  font-weight: 680;
  letter-spacing: -0.065em;
  line-height: 0.98;
}

h1 em {
  color: var(--gold);
  font-family: Georgia, 'Times New Roman', serif;
  font-weight: 400;
}

.intro {
  max-width: 36ch;
  margin: 0;
  color: var(--muted);
  font-size: clamp(0.95rem, 1.4vw, 1.08rem);
  line-height: 1.65;
}

.study-area {
  width: min(100%, 610px);
  justify-self: end;
}

.card-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.9rem;
  padding-inline: 0.25rem;
  color: var(--muted);
  font-family: "Courier New", Courier, monospace;
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.side-label {
  display: inline-flex;
  gap: 0.5rem;
  align-items: center;
}

.side-label::before {
  width: 0.4rem;
  height: 0.4rem;
  border-radius: 50%;
  background: var(--lime);
  content: '';
}

.side-label.is-answer::before {
  background: var(--coral);
}

.card-stage {
  perspective: 1500px;
}

.flashcard {
  position: relative;
  display: block;
  width: 100%;
  min-height: clamp(430px, 56vw, 500px);
  padding: 0;
  border: 0;
  border-radius: 1.25rem;
  background: transparent;
  color: var(--forest);
  cursor: pointer;
  text-align: left;
  transform: translateZ(0);
}

.flashcard:focus-visible {
  outline: 3px solid var(--sky);
  outline-offset: 6px;
}

.flashcard-inner {
  position: absolute;
  inset: 0;
  display: block;
  transform-style: preserve-3d;
  transition: transform 650ms cubic-bezier(0.2, 0.75, 0.2, 1);
}

.flashcard.is-flipped .flashcard-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  display: flex;
  overflow: hidden;
  flex-direction: column;
  border: 1px solid rgba(16, 37, 30, 0.14);
  border-radius: 1.25rem;
  backface-visibility: hidden;
  background: var(--paper-bright);
  box-shadow: 0 2rem 5rem rgba(3, 14, 10, 0.38);
}

.card-face::before {
  position: absolute;
  inset: 0;
  border: 8px solid rgba(16, 37, 30, 0.025);
  border-radius: inherit;
  pointer-events: none;
  content: '';
}

.card-front {
  align-items: center;
  padding: 1.4rem 1.5rem 1.25rem;
  text-align: center;
}

.card-topline {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  color: #607167;
  font-family: "Courier New", Courier, monospace;
  font-size: 0.65rem;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.selection-art {
  position: relative;
  display: block;
  width: clamp(150px, 24vw, 188px);
  height: clamp(150px, 24vw, 188px);
  margin: clamp(1rem, 4vw, 2rem) auto 1rem;
  border: 1px solid rgba(16, 37, 30, 0.1);
  border-radius: 50%;
  background: rgba(185, 217, 99, 0.1);
}

.environment,
.link,
.specimen {
  position: absolute;
  display: block;
}

.environment {
  inset: 16%;
  border: 1px dashed rgba(16, 37, 30, 0.24);
  border-radius: 50%;
}

.specimen {
  width: 1.4rem;
  height: 1.4rem;
  border: 3px solid var(--paper-bright);
  border-radius: 50% 50% 50% 12%;
  background: var(--lime);
  box-shadow: 0 0 0 1px rgba(16, 37, 30, 0.1);
  transform: rotate(-28deg);
}

.specimen--one { top: 19%; left: 43%; }
.specimen--two { top: 34%; right: 18%; }
.specimen--three { right: 23%; bottom: 20%; }
.specimen--four { bottom: 15%; left: 40%; }
.specimen--five { bottom: 28%; left: 17%; }
.specimen--six { top: 28%; left: 20%; }

.link {
  top: 49%;
  left: 50%;
  width: 56%;
  height: 1px;
  background: rgba(16, 37, 30, 0.16);
  transform-origin: left center;
}

.link--one { transform: rotate(28deg); }
.link--two { transform: rotate(148deg); }
.link--three { transform: rotate(265deg); }

.selection-art--overproduction .environment {
  inset: 38%;
  border: 0;
  background: var(--coral);
  box-shadow: inset -0.35rem -0.35rem 0 rgba(16, 37, 30, 0.12);
}

.selection-art--overproduction .link {
  display: none;
}

.selection-art--variation .specimen--one { background: var(--coral); transform: rotate(-28deg) scale(0.72); }
.selection-art--variation .specimen--two { background: var(--gold); transform: rotate(12deg) scale(1.2); }
.selection-art--variation .specimen--three { background: var(--sky); transform: rotate(52deg) scale(0.85); }
.selection-art--variation .specimen--four { background: var(--forest-soft); transform: rotate(-8deg) scale(1.08); }
.selection-art--variation .specimen--five { background: var(--lime); transform: rotate(80deg) scale(0.66); }
.selection-art--variation .specimen--six { background: #a97cb8; transform: rotate(30deg) scale(1.15); }
.selection-art--variation .link { display: none; }

.selection-art--competition .environment {
  inset: 42%;
  border: 0;
  background: var(--gold);
}

.selection-art--competition .specimen--one,
.selection-art--competition .specimen--two {
  top: 42%;
  width: 2.5rem;
  height: 2.5rem;
  background: var(--coral);
}

.selection-art--competition .specimen--one { left: 14%; }
.selection-art--competition .specimen--two { right: 14%; }
.selection-art--competition .specimen--three,
.selection-art--competition .specimen--four,
.selection-art--competition .specimen--five,
.selection-art--competition .specimen--six { display: none; }
.selection-art--competition .link--two,
.selection-art--competition .link--three { display: none; }
.selection-art--competition .link--one {
  top: 50%;
  left: 28%;
  width: 44%;
  transform: none;
}

.selection-art--heredity .environment {
  display: none;
}

.selection-art--heredity .specimen--one {
  top: 14%;
  left: calc(50% - 1.15rem);
  width: 2.3rem;
  height: 2.3rem;
  background: var(--sky);
}

.selection-art--heredity .specimen--two,
.selection-art--heredity .specimen--three,
.selection-art--heredity .specimen--four {
  top: auto;
  bottom: 19%;
  background: var(--sky);
}

.selection-art--heredity .specimen--two { left: 19%; }
.selection-art--heredity .specimen--three { right: 19%; }
.selection-art--heredity .specimen--four { left: calc(50% - 0.7rem); background: var(--lime); }
.selection-art--heredity .specimen--five,
.selection-art--heredity .specimen--six { display: none; }
.selection-art--heredity .link {
  top: 42%;
  left: 50%;
  width: 35%;
}
.selection-art--heredity .link--one { transform: rotate(58deg); }
.selection-art--heredity .link--two { transform: rotate(90deg); }
.selection-art--heredity .link--three { transform: rotate(122deg); }

.selection-art--reproduction .environment {
  inset: 30%;
  border: 0;
  background: rgba(239, 188, 82, 0.18);
}

.selection-art--reproduction .specimen--one {
  top: 38%;
  left: 38%;
  width: 3rem;
  height: 3rem;
  background: var(--gold);
}

.selection-art--reproduction .specimen:not(.specimen--one) {
  width: 1rem;
  height: 1rem;
  background: var(--lime);
}

.selection-art--pressure {
  overflow: hidden;
  background: linear-gradient(108deg, rgba(114, 183, 189, 0.28) 0 49%, rgba(237, 114, 88, 0.18) 50% 100%);
}

.selection-art--pressure::after {
  position: absolute;
  top: -15%;
  left: 50%;
  width: 2px;
  height: 130%;
  background: rgba(16, 37, 30, 0.15);
  content: '';
  transform: rotate(18deg);
}

.selection-art--pressure .environment,
.selection-art--pressure .link { display: none; }
.selection-art--pressure .specimen--two,
.selection-art--pressure .specimen--four,
.selection-art--pressure .specimen--six { opacity: 0.23; }

.name-wrap {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.factor-name {
  display: block;
  max-width: 16ch;
  margin-top: 0.5rem;
  color: var(--forest);
  font-family: Georgia, 'Times New Roman', serif;
  font-size: clamp(2rem, 5vw, 3.45rem);
  font-weight: 500;
  letter-spacing: -0.045em;
  line-height: 0.98;
}

.factor-name--overview {
  max-width: 14ch;
  font-size: clamp(1.9rem, 4.2vw, 3rem);
  line-height: 1.02;
}

.flip-hint {
  display: inline-flex;
  gap: 0.55rem;
  align-items: center;
  align-self: center;
  color: #68776f;
  font-family: "Courier New", Courier, monospace;
  font-size: 0.66rem;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.flip-symbol {
  display: grid;
  width: 1.55rem;
  height: 1.55rem;
  place-items: center;
  border: 1px solid #c8cec5;
  border-radius: 50%;
  color: var(--forest);
  font-size: 0.96rem;
}

.card-back {
  padding: clamp(1.8rem, 5vw, 3rem);
  background:
    linear-gradient(rgba(16, 37, 30, 0.035) 1px, transparent 1px) 0 0 / 100% 2.3rem,
    var(--paper-bright);
  transform: rotateY(180deg);
}

.answer-kicker {
  margin-bottom: 0.65rem;
}

.flashcard--gold .answer-kicker,
.flashcard--gold .prompt { color: #9a6a0c; }
.flashcard--coral .answer-kicker,
.flashcard--coral .prompt { color: #b8422d; }
.flashcard--sky .answer-kicker,
.flashcard--sky .prompt { color: #236a70; }

.back-factor {
  color: #5f7167;
  font-family: "Courier New", Courier, monospace;
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.045em;
  text-transform: uppercase;
}

.rule {
  width: 3.4rem;
  height: 0.25rem;
  margin-block: clamp(1.25rem, 3vw, 1.85rem);
  border-radius: 1rem;
  background: var(--lime);
}

.flashcard--gold .rule { background: var(--gold); }
.flashcard--coral .rule { background: var(--coral); }
.flashcard--sky .rule { background: var(--sky); }

.definition {
  display: block;
  max-width: 21ch;
  color: var(--forest);
  font-family: Georgia, 'Times New Roman', serif;
  font-size: clamp(1.75rem, 4vw, 2.65rem);
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1.08;
}

.overview-list {
  display: grid;
  width: 100%;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.75rem;
}

.overview-item {
  display: grid;
  min-height: 3.8rem;
  grid-template-columns: 1.6rem 1fr;
  gap: 0.65rem;
  align-items: center;
  padding: 0.6rem 0.7rem;
  border: 1px solid rgba(16, 37, 30, 0.12);
  border-radius: 0.7rem;
  background: rgba(185, 217, 99, 0.09);
}

.overview-item > span {
  display: grid;
  width: 1.6rem;
  height: 1.6rem;
  place-items: center;
  border-radius: 50%;
  background: var(--lime);
  color: var(--forest);
  font-family: "Courier New", Courier, monospace;
  font-size: 0.68rem;
  font-weight: 800;
}

.overview-item strong {
  color: var(--forest);
  font-size: clamp(0.78rem, 1.7vw, 0.94rem);
  line-height: 1.14;
}

.overview-list--compact {
  gap: 0.42rem;
}

.overview-item--compact {
  min-height: 2.65rem;
  grid-template-columns: 1.3rem 1fr;
  gap: 0.45rem;
  padding: 0.38rem 0.5rem;
  background: rgba(16, 37, 30, 0.025);
}

.overview-item--compact > span {
  width: 1.3rem;
  height: 1.3rem;
  background: #dfe4d9;
  font-size: 0.6rem;
}

.overview-item--compact strong {
  font-size: clamp(0.67rem, 1.35vw, 0.8rem);
}

.overview-item.is-highlighted {
  border-color: #789b22;
  background: rgba(185, 217, 99, 0.5);
  box-shadow: inset 0 0 0 1px #789b22;
}

.flashcard--gold .overview-item.is-highlighted {
  border-color: #b47c0b;
  background: rgba(239, 188, 82, 0.5);
  box-shadow: inset 0 0 0 1px #b47c0b;
}

.flashcard--coral .overview-item.is-highlighted {
  border-color: #bd432d;
  background: rgba(237, 114, 88, 0.4);
  box-shadow: inset 0 0 0 1px #bd432d;
}

.flashcard--sky .overview-item.is-highlighted {
  border-color: #29757b;
  background: rgba(114, 183, 189, 0.42);
  box-shadow: inset 0 0 0 1px #29757b;
}

.overview-item.is-highlighted > span {
  background: var(--forest);
  color: var(--paper-bright);
}

.description-label {
  display: block;
  margin-top: 1rem;
  color: #607167;
  font-family: "Courier New", Courier, monospace;
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.definition--compact {
  max-width: 26ch;
  margin-top: 0.32rem;
  font-size: clamp(1.25rem, 3vw, 1.8rem);
  line-height: 1.05;
}

.flip-hint--back {
  margin-top: auto;
  padding-top: 1rem;
}

.card-controls {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 1rem;
  align-items: center;
  margin-top: 1.35rem;
}

.nav-button {
  display: inline-flex;
  gap: 0.6rem;
  align-items: center;
  justify-self: start;
  padding: 0.55rem 0;
  border: 0;
  border-bottom: 1px solid rgba(245, 241, 227, 0.2);
  background: transparent;
  color: var(--paper);
  cursor: pointer;
  font-size: 0.76rem;
  font-weight: 650;
  letter-spacing: 0.04em;
}

.nav-button:hover,
.nav-button:focus-visible {
  border-color: var(--lime);
  color: var(--gold);
}

.nav-button:focus-visible,
.progress-dot:focus-visible {
  outline: 2px solid var(--sky);
  outline-offset: 4px;
}

.nav-button--next { justify-self: end; }
.arrow { font-size: 1.15rem; line-height: 1; }
.arrow--left { transform: rotate(180deg); }

.progress-dots {
  display: flex;
  gap: 0.48rem;
  align-items: center;
  justify-content: center;
}

.progress-dot {
  width: 0.44rem;
  height: 0.44rem;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(245, 241, 227, 0.24);
  cursor: pointer;
  transition: width 180ms ease, border-radius 180ms ease, background 180ms ease;
}

.progress-dot:hover { background: rgba(245, 241, 227, 0.6); }
.progress-dot.is-current {
  width: 1.5rem;
  border-radius: 1rem;
  background: var(--lime);
}

.keyboard-tip {
  margin: 1.35rem 0 0;
  color: #789184;
  font-family: "Courier New", Courier, monospace;
  font-size: 0.63rem;
  text-align: center;
  transition: opacity 200ms ease;
}

.keyboard-tip span {
  padding: 0.18rem 0.35rem;
  border: 1px solid rgba(169, 185, 172, 0.25);
  border-radius: 0.25rem;
  color: #b8c5ba;
}

.keyboard-tip.is-muted { opacity: 0.55; }

footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-block: 1.5rem 1.8rem;
  border-top: 1px solid rgba(245, 241, 227, 0.1);
  color: #789184;
  font-family: "Courier New", Courier, monospace;
  font-size: 0.62rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

footer p { margin: 0; }

@media (max-width: 850px) {
  .hero {
    grid-template-columns: 1fr;
    gap: 2.2rem;
    max-width: 650px;
  }

  .hero-copy {
    padding-bottom: 0;
    text-align: center;
  }

  h1,
  .intro { margin-inline: auto; }
  h1 { max-width: 13ch; }
  .study-area { justify-self: center; }
}

@media (max-width: 560px) {
  .site-header,
  .hero,
  footer {
    width: min(100% - 1.5rem, 650px);
  }

  .site-header { padding-block: 1.15rem; }
  .brand { font-size: 0.7rem; }
  .brand-mark { width: 1.65rem; height: 1.65rem; }

  .course-label {
    max-width: 12ch;
    text-align: right;
  }

  .hero {
    gap: 1.6rem;
    padding-block: 2.4rem 3.5rem;
  }

  h1 { font-size: clamp(2.5rem, 13vw, 3.6rem); }
  .intro { font-size: 0.9rem; }
  .flashcard { min-height: 440px; }
  .card-front { padding: 1.2rem 1.1rem 1rem; }
  .selection-art { width: 145px; height: 145px; }
  .factor-name { font-size: clamp(1.95rem, 10vw, 2.8rem); }
  .factor-name--overview { font-size: clamp(1.8rem, 8vw, 2.45rem); }
  .card-back { padding: 1.6rem 1.4rem 1.25rem; }
  .definition { font-size: clamp(1.55rem, 7vw, 2.05rem); }
  .overview-list { gap: 0.5rem; }
  .overview-item {
    min-height: 3.4rem;
    grid-template-columns: 1.35rem 1fr;
    gap: 0.45rem;
    padding: 0.45rem;
  }
  .overview-item > span { width: 1.35rem; height: 1.35rem; }
  .overview-item strong { font-size: 0.72rem; }
  .overview-list--compact { gap: 0.35rem; }
  .overview-item--compact {
    min-height: 2.5rem;
    grid-template-columns: 1.15rem 1fr;
    gap: 0.35rem;
    padding: 0.32rem 0.4rem;
  }
  .overview-item--compact > span { width: 1.15rem; height: 1.15rem; }
  .overview-item--compact strong { font-size: 0.64rem; }
  .description-label { margin-top: 0.75rem; }
  .definition--compact { font-size: clamp(1.18rem, 5vw, 1.55rem); }

  .card-controls { gap: 0.6rem; }
  .nav-button span:not(.arrow) { display: none; }
  .nav-button {
    width: 2.25rem;
    height: 2.25rem;
    justify-content: center;
    padding: 0;
    border: 1px solid rgba(245, 241, 227, 0.22);
    border-radius: 50%;
  }

  .keyboard-tip { display: none; }
  footer { justify-content: center; }
  footer p:last-child { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .flashcard-inner,
  .progress-dot { transition-duration: 0.01ms; }
}

    </style>
  </head>
  <body>
    <main class="study-shell">
      <div class="ambient ambient--one" aria-hidden="true"></div>
      <div class="ambient ambient--two" aria-hidden="true"></div>

      <header class="site-header">
        <a class="brand" href="#study-card" aria-label="Natural Selection home">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>Natural Selection</span>
        </a>
        <p class="course-label">Six-factor study deck</p>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">Biology • 7 cards</p>
          <h1 id="page-title">6 Factors of <em>Natural Selection</em></h1>
          <p class="intro">
            Start with all six factors, then flip through the short memory cues
            from your notes.
          </p>
        </div>

        <div class="study-area">
          <div class="card-status" aria-live="polite" aria-atomic="true">
            <span id="card-count">Card 01 / 07</span>
            <span class="side-label" id="side-label">Front</span>
          </div>

          <div class="card-stage">
            <button
              id="study-card"
              type="button"
              class="flashcard flashcard--lime"
              aria-pressed="false"
              aria-label="Show back of 6 factors of Natural Selection"
            >
              <span class="flashcard-inner">
                <span class="card-face card-front">
                  <span class="card-topline">
                    <span id="factor-number">Overview</span>
                    <span>Natural Selection</span>
                  </span>

                  <span class="selection-art selection-art--overview" aria-hidden="true">
                    <span class="environment"></span>
                    <span class="link link--one"></span>
                    <span class="link link--two"></span>
                    <span class="link link--three"></span>
                    <span class="specimen specimen--one"></span>
                    <span class="specimen specimen--two"></span>
                    <span class="specimen specimen--three"></span>
                    <span class="specimen specimen--four"></span>
                    <span class="specimen specimen--five"></span>
                    <span class="specimen specimen--six"></span>
                  </span>

                  <span class="name-wrap">
                    <span class="prompt" id="front-prompt">Start here</span>
                    <strong class="factor-name factor-name--overview" id="factor-name">6 factors of Natural Selection</strong>
                  </span>

                  <span class="flip-hint">
                    <span class="flip-symbol" aria-hidden="true">↻</span>
                    Tap to reveal
                  </span>
                </span>

                <span class="card-face card-back">
                  <span class="answer-kicker" id="answer-number">Overview</span>
                  <span class="back-factor" id="back-factor">The six factors</span>
                  <span class="rule" aria-hidden="true"></span>
                  <span class="overview-list" id="overview-list">
                    <span class="overview-item"><span>1</span><strong>Overproduction</strong></span>
                    <span class="overview-item"><span>2</span><strong>Variation</strong></span>
                    <span class="overview-item"><span>3</span><strong>Competition</strong></span>
                    <span class="overview-item"><span>4</span><strong>Heredity</strong></span>
                    <span class="overview-item"><span>5</span><strong>Differential Reproduction</strong></span>
                    <span class="overview-item"><span>6</span><strong>Environmental Pressure</strong></span>
                  </span>
                  <span class="description-label" id="description-label" hidden></span>
                  <strong class="definition" id="definition" hidden></strong>

                  <span class="flip-hint flip-hint--back">
                    <span class="flip-symbol" aria-hidden="true">↻</span>
                    Tap to see factor
                  </span>
                </span>
              </span>
            </button>
          </div>

          <nav class="card-controls" aria-label="Flash card controls">
            <button class="nav-button" id="previous-card" type="button">
              <span aria-hidden="true" class="arrow arrow--left">→</span>
              <span>Previous</span>
            </button>

            <div class="progress-dots" id="progress-dots" aria-label="Choose a card"></div>

            <button class="nav-button nav-button--next" id="next-card" type="button">
              <span>Next</span>
              <span aria-hidden="true" class="arrow arrow--right">→</span>
            </button>
          </nav>

          <p class="keyboard-tip" id="keyboard-tip">
            <span aria-hidden="true">Space</span> to flip •
            <span aria-hidden="true">← →</span> to move
          </p>
        </div>
      </section>

      <footer>
        <p>1 overview • 6 factors</p>
        <p>Study. Flip. Repeat.</p>
      </footer>
    </main>
    <script>
const cards = [
  {
    factor: '6 factors of Natural Selection',
    definition: '',
    overview: [
      'Overproduction',
      'Variation',
      'Competition',
      'Heredity',
      'Differential Reproduction',
      'Environmental Pressure',
    ],
    art: 'overview',
    accent: 'lime',
  },
  {
    factor: 'Overproduction',
    definition: 'More offspring than can survive.',
    art: 'overproduction',
    accent: 'lime',
  },
  {
    factor: 'Variation',
    definition: 'Differences in genes and traits.',
    art: 'variation',
    accent: 'gold',
  },
  {
    factor: 'Competition',
    definition:
      'Limited food and resources; “best fit” survive and reproduce.',
    art: 'competition',
    accent: 'coral',
  },
  {
    factor: 'Heredity',
    definition: 'Advantageous traits passed on.',
    art: 'heredity',
    accent: 'sky',
  },
  {
    factor: 'Differential Reproduction',
    definition:
      'Different variations, different reproductive rates.',
    art: 'reproduction',
    accent: 'gold',
  },
  {
    factor: 'Environmental Pressure',
    definition:
      'Environmental change: adapt or become extinct.',
    art: 'pressure',
    accent: 'coral',
  },
];

const factorNames = cards.slice(1).map((card) => card.factor);

const cardButton = document.querySelector('#study-card');
const cardCount = document.querySelector('#card-count');
const sideLabel = document.querySelector('#side-label');
const factorNumber = document.querySelector('#factor-number');
const answerNumber = document.querySelector('#answer-number');
const frontPrompt = document.querySelector('#front-prompt');
const factorName = document.querySelector('#factor-name');
const backFactor = document.querySelector('#back-factor');
const descriptionLabel = document.querySelector('#description-label');
const definition = document.querySelector('#definition');
const overviewList = document.querySelector('#overview-list');
const selectionArt = document.querySelector('.selection-art');
const dotsContainer = document.querySelector('#progress-dots');
const keyboardTip = document.querySelector('#keyboard-tip');

let current = 0;
let isFlipped = false;

function setStarted() {
  keyboardTip.classList.add('is-muted');
}

function renderCard() {
  const card = cards[current];
  cardButton.className = `flashcard flashcard--${card.accent}`;
  cardButton.setAttribute('aria-pressed', 'false');
  cardButton.setAttribute('aria-label', `Show back of ${card.factor}`);
  cardCount.textContent = `Card ${String(current + 1).padStart(2, '0')} / ${String(
    cards.length,
  ).padStart(2, '0')}`;
  sideLabel.textContent = 'Front';
  sideLabel.classList.remove('is-answer');
  factorNumber.textContent = card.overview ? 'Overview' : `Factor ${current} of 6`;
  answerNumber.textContent = card.overview ? 'Overview' : `Factor ${current} of 6`;
  frontPrompt.textContent = card.overview ? 'Start here' : 'What does this mean?';
  factorName.textContent = card.factor;
  factorName.classList.toggle('factor-name--overview', Boolean(card.overview));
  backFactor.textContent = card.overview ? 'The six factors' : card.factor;
  definition.textContent = card.definition;
  definition.hidden = Boolean(card.overview);
  definition.classList.toggle('definition--compact', !card.overview);
  descriptionLabel.hidden = Boolean(card.overview);
  descriptionLabel.textContent = card.factor;
  overviewList.hidden = false;
  overviewList.classList.toggle('overview-list--compact', !card.overview);
  overviewList.innerHTML = (card.overview || factorNames)
    .map(
      (factor, index) =>
        `<span class="overview-item${card.overview ? '' : ' overview-item--compact'}${
          factor === card.factor ? ' is-highlighted' : ''
        }"><span>${index + 1}</span><strong>${factor}</strong></span>`,
    )
    .join('');
  selectionArt.className = `selection-art selection-art--${card.art}`;
  isFlipped = false;

  document.querySelectorAll('.progress-dot').forEach((dot, index) => {
    dot.classList.toggle('is-current', index === current);
    dot.toggleAttribute('aria-current', index === current);
  });
}

function flipCard() {
  isFlipped = !isFlipped;
  cardButton.classList.toggle('is-flipped', isFlipped);
  cardButton.setAttribute('aria-pressed', String(isFlipped));
  cardButton.setAttribute(
    'aria-label',
    `${isFlipped ? 'Showing back of' : 'Show back of'} ${cards[current].factor}`,
  );
  sideLabel.textContent = isFlipped ? 'Back' : 'Front';
  sideLabel.classList.toggle('is-answer', isFlipped);
  setStarted();
}

function goTo(index) {
  current = (index + cards.length) % cards.length;
  renderCard();
  setStarted();
}

cards.forEach((card, index) => {
  const dot = document.createElement('button');
  dot.type = 'button';
  dot.className = `progress-dot${index === 0 ? ' is-current' : ''}`;
  dot.setAttribute('aria-label', `Go to card ${index + 1}: ${card.factor}`);
  if (index === 0) dot.setAttribute('aria-current', 'step');
  dot.addEventListener('click', () => goTo(index));
  dotsContainer.appendChild(dot);
});

cardButton.addEventListener('click', flipCard);
document.querySelector('#previous-card').addEventListener('click', () => goTo(current - 1));
document.querySelector('#next-card').addEventListener('click', () => goTo(current + 1));

window.addEventListener('keydown', (event) => {
  if (event.key === 'ArrowRight') goTo(current + 1);
  if (event.key === 'ArrowLeft') goTo(current - 1);
  if ((event.key === ' ' || event.key === 'Enter') && document.activeElement !== cardButton) {
    event.preventDefault();
    flipCard();
  }
});

    </script>
  </body>
</html>
